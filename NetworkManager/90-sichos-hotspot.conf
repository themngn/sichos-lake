# The hotspot's own interface (udev/70-sichos-hotspot.rules) stays unmanaged
# until the Hotspot tile turns it on: quickshell/scripts/hotspot.sh runs
# `nmcli device set sichos-ap0 managed yes` (a runtime override of this)
# just before starting the hotspot, and `managed no` after stopping it.
# Managed all the time, NetworkManager would autoconnect saved networks on
# it as a second client.
[device-sichos-hotspot]
match-device=interface-name:sichos-ap*
managed=0
