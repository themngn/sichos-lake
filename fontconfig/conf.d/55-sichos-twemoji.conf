<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Twemoji (twitter-twemoji-fonts, packages.txt) ahead of Noto Color Emoji,
  system-wide. Fedora's Noto (COLRv1) draws every family emoji (👪,
  👩‍👩‍👧‍👧, …) as black silhouettes on a white tile: Google's current
  design, not a rendering bug (pango renders it the same as Qt). Twemoji has
  them in full color.

  Fedora's Twemoji stops at Emoji 14, so Noto stays right behind it as the
  fallback for anything newer (the 15.1 "family: adult, adult, child"
  sequences, 🫨, …); those still render, just in Noto's style.

  Loaded from ~/.config/fontconfig/conf.d via 50-user.conf, i.e. before
  60-generic.conf's own "emoji" alias, so Twemoji lands first in that
  list. Fedora's list names "Twitter Color Emoji", not this package's
  "Twemoji" family, so without this it's never picked at all.

  Only the generic "emoji" is redirected: asking for "Noto Color Emoji" by
  name still gets Noto. EmojiPicker.qml relies on that to draw Emoji 15+
  sequences, which Twemoji lacks and would split into separate faces
  (🧑‍🧑‍🧒 as three heads), in Noto instead.
-->
<fontconfig>
  <alias binding="same">
    <family>emoji</family>
    <prefer>
      <family>Twemoji</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
