# Deployed to /etc/sddm.conf.d/10-theme.conf by install.sh. Activates the
# hand-written SichOS theme (sddm/sichos/) and configures cage as the
# Wayland greeter compositor.
#
# Upstream SDDM's default Wayland compositor is `weston --shell=kiosk`, which
# does not manage or render mouse cursors for greeters (kiosk-shell design,
# missing wp_cursor_shape protocol in Weston). `cage` (wlroots-based) is
# specifically built to run a single fullscreen Wayland app with full native
# wlr_cursor support, hardware/software cursor planes, and XCURSOR_THEME/SIZE
# inheritance.
[General]
DisplayServer=wayland
GreeterEnvironment=QML_DISABLE_DISK_CACHE=1,XCURSOR_THEME=Adwaita,XCURSOR_SIZE=24

[Wayland]
CompositorCommand=cage -s -d

[Theme]
Current=sichos
CursorTheme=Adwaita
CursorSize=24
