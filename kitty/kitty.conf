font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

background_opacity 0.8
hide_window_decorations yes

# Lets the bar's transparency toggle (TransparencyToggle.qml) push a live
# `kitty @ set-background-opacity` to every already-open window instead of
# only taking effect on the next kitty launch — this line itself just sets
# the opacity new windows start at, and the toggle script keeps it in sync.
# {kitty_pid} gives each OS window instance its own socket path so the
# toggle script can glob /tmp/kitty-sichos-* and reach all of them.
allow_remote_control yes
listen_on unix:/tmp/kitty-sichos-{kitty_pid}

confirm_os_window_close 0

window_border_width 0
window_margin_width 0
window_padding_width 0
draw_minimal_borders no
