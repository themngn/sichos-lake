# SichOS override of HyprQuickFrame's bundled theme.toml — same defaults,
# animations off and the selection outline squared off. Installed to
# ~/.config/hyprquickframe/theme.toml, which HyprQuickFrame checks before
# its own repo copy.
#
# borderRadius only affects the region/window selection outline below — the
# bottom toolbar and toggle pills use a hardcoded `radius: height / 2` in
# HyprQuickFrame's own QML (components/ControlBar.qml, QuickToggle.qml), not
# driven by theme.toml, so they stay pill-shaped regardless of this setting.

# Main highlight color on the active tab
accent = "#698b85"
# Text color on the active tab (should contrast with accent)
accentText = "#0E1415"
# Dim overlay opacity when selecting (0.0 - 1.0)
dimOpacity = 0.6
# Corner radius on selection outline
borderRadius = 0
# Selection outline thickness
outlineThickness = 2
# Distance from bottom edge to the bar
bottomMargin = 60
# Global animation toggle (true/false)
animations = false
# Tool to use for the "edit" screenshot action (e.g., "satty" or "gradia")
annotationTool = "satty"

[bar]
# Segmented control background
background = "rgba(14, 20, 21, 0.6)"
# Segmented control border
border = "rgba(105, 139, 133, 0.3)"
# Inactive tab text color
text = "#f0f9e3"
# Drop shadow under the bar
shadow = "#80000000"

[toggle]
# Drop shadow under toggle pills
shadow = "#80000000"
# Edit toggle icon color
edit = "#b2cfb8"
# Temp toggle icon color
temp = "#698b85"

[share]
# Icon color when device is reachable
connected = "#698b85"
# Icon color while checking connectivity
pending = "#676f71"
# Icon color on connection failure
errorIcon = "#f0f9e3"
# Background color on connection failure
errorBackground = "#a9b495"

[hooks]
# Command to run after a screenshot is saved (leave empty to disable)
# Placeholders: %f = full path, %n = filename, %d = directory, %t = timestamp
postSaveHook = ""
