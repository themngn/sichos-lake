# Shared theming for Hyprtoolkit-based apps (currently just hyprshutdown,
# SUPER+M) — libhyprtoolkit.so reads this from $XDG_CONFIG_HOME/hypr or
# ~/.config/hypr regardless of which app links it, no per-app config exists.
# Colors/font matched to quickshell's Theme.qml singleton (accent, text,
# background) and the colors.toml palette, so hyprshutdown
# matches the rest of this desktop.

background = 0xFF000000
base = 0xFF141C1E
alternate_base = 0xFF262C2C
text = 0xFFF0F9E3
bright_text = 0xFFF4FBEA
accent = 0xFF698B85
accent_secondary = 0xFF77A29B

font_family = JetBrainsMono Nerd Font Mono
font_family_monospace = JetBrainsMono Nerd Font Mono

rounding_large = 8
rounding_small = 4
