# Shared theming for Hyprtoolkit-based apps (currently just hyprshutdown:
# Log Out/Reboot/Shut Down in PowerMenu.qml and the launcher's Power folder)
# -- libhyprtoolkit.so reads this from $XDG_CONFIG_HOME/hypr or ~/.config/hypr
# regardless of which app links it, no per-app config exists. Values are
# quickshell's Theme.qml tokens, so it reads like the launcher/power menu.
#
# hyprshutdown's layout is fixed; only these knobs exist. What each one
# paints there (found by setting each to a loud color and screenshotting
# `hyprshutdown --dry-run --no-exit`):
#   background     - the whole-screen layer behind everything (alpha is
#                    honored; blurred by the "hyprshutdown" layer rule in
#                    window_rules.lua, so it reads as a frosted backdrop
#                    rather than a flat dim -- the app list has no fill of
#                    its own and needs that to stay legible)
#   base           - button fill
#   alternate_base - button border
#   accent         - app-list border and a hovered button's border
#   h1_size        - the "Shutting down..." title and each app's name
# h2_size/h3_size/small_font_size/bright_text/accent_secondary changed
# nothing visible; the body text and button labels are fixed sizes.

background = 0xD9141C1E       # Theme.cardBackground, 85%
base = 0xFF2D3332             # Theme.surfaceRaised
alternate_base = 0x1AFFFFFF   # Theme.surfaceBorder (white 10%)
text = 0xFFF0F9E3             # Theme.text
bright_text = 0xFFF0F9E3
accent = 0xFF698B85           # Theme.accent
accent_secondary = 0xFF77A29B # Theme.accentHover

# Theme.uiFontFamily (the monospace Nerd Font this used before wrapped the
# button labels mid-word: "Canc-el").
font_family = Inter
font_family_monospace = JetBrainsMono Nerd Font Mono

h1_size = 16                  # Theme.headerIconSize (fontSize + 3)

rounding_large = 12           # Theme.surfaceRadius
rounding_small = 7            # Theme.controlRadius
