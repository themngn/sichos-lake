# Not required for hyprsunset to run, but without it there's nothing to
# schedule — see https://wiki.hypr.land/Hypr-Ecosystem/hyprsunset/.
# On startup hyprsunset applies whichever profile's time has most recently
# passed, then switches automatically as the clock crosses each one.

profile {
    time = 07:00
    identity = true
}

profile {
    time = 23:00
    temperature = 3500
}
