# The Night Light schedule, read and written by the shell (ShellState.qml,
# SunsetPopup.qml), which also does the switching: hyprsunset only ever gets
# told what to show. The profiles are commented out on purpose. hyprsunset
# reads this file too and would switch by itself at each time, and it has no
# way to be told not to: with Follow schedule off, the light came on at the
# night time until the shell noticed and put it back, up to 10s later.
# The shell only looks for the two values below, day first, then night.

# profile {
#     time = 07:00
#     identity = true
# }

# profile {
#     time = 23:00
#     temperature = 3500
# }
