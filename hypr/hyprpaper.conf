preload = $HOME/Pictures/wallpaper.jpg
wallpaper = ,$HOME/Pictures/wallpaper.jpg
splash = false
# This static "wallpaper" line never actually assigns anything on this
# build — every monitor logs "has no target: no wp will be created" right
# after startup regardless of what's here (confirmed by testing). The
# real assignment happens at runtime via install.sh's "hyprctl hyprpaper
# wallpaper" IPC call — that's also where fit_mode is actually set, as
# its optional third comma-separated argument ([mon],[path],[fit_mode]).
