# Not required for hypridle to run, but without it there's nothing to time
# out — see https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/. Everything
# from the first "listener" block onward is fully owned by the bar's Stay
# Awake right-click panel (IdlePopup.qml) — it regenerates that whole
# section on Save (0 to 3 listeners: dim, lock, display-off, each skippable
# via its own "Never" toggle) and restarts hypridle, the same way
# SunsetPopup.qml edits hyprsunset.conf. Hand-editing below this point will
# just get overwritten by the next Save.
#
# The bar's Stay Awake toggle (IdleInhibitor in Bar.qml) suspends every
# listener below while on — that's the whole point of it existing.

general {
    # lock_cmd matches keybindings.lua's own SUPER+L bind exactly (a plain
    # hyprlock exec, not `loginctl lock-session`) — kept as a plain exec on
    # the original theory that logind session plumbing wasn't reliable
    # under this setup's old greetd-autologin gap (see CLAUDE.md's Hyprland
    # section); unverified whether that still holds now under the
    # SDDM+uwsm session where graphical-session.target does activate, so
    # not switched on a guess. pidof guards against a second hyprlock
    # stacking on top of one already up if hypridle's own timeout fires
    # again before the first unlock.
    lock_cmd = pidof hyprlock || hyprlock
    # `hyprctl dispatch dpms on` doesn't work on this Lua-config Hyprland
    # build — `hyprctl dispatch <name> <args>` gets evaluated as Lua
    # (`hl.dispatch(<name> <args>)`), and a bare `dpms on` isn't valid Lua,
    # so it silently fails (confirmed live: dpmsStatus never changed, and
    # the error showed up in hypridle's own log). The eval'd
    # hl.dispatch(hl.dsp.dpms(...)) form is the one that actually works —
    # confirmed by watching dpmsStatus flip in `hyprctl monitors -j`.
    #
    # A single attempt isn't reliable right after a *real* suspend/resume
    # though (as opposed to the display-off listener below, which never
    # actually suspends anything) -- confirmed live via a black-screen
    # incident: hypridle's own log showed this exact command running and
    # returning "ok" immediately after resume, hyprctl still reported
    # dpmsStatus=false minutes later (panel otherwise fine -- not disabled,
    # brightness/workspace/window state all normal), and re-running the
    # *identical* command by hand then fixed it. So the call itself is
    # right; it's racing something still settling after resume (amdgpu DC
    # errors show up in the kernel log in the same window). A few retries
    # a couple seconds apart is NOT enough -- confirmed live that retries
    # at +0s/+1s/+3s all failed while an identical one at +83s worked, so
    # this defers to dpms-restore-after-resume.sh, which polls and keeps
    # retrying against a much longer timeout instead of a fixed schedule.
    #
    # dpms-restore-after-resume.sh also nudges hyprpaper to redraw the
    # background on the same resume -- see that script's own header for
    # why. Deliberately kept as this single plain executable path rather
    # than a "cmd1 & cmd2" shell one-liner here: confirmed live that
    # hypridle only pipes a plain command's stdout into its own journal
    # log (which is how "restored after Xs" below shows up at all) --
    # handing it a string containing a shell '&' instead made it log a
    # bare "Process Created with pid X" and nothing else ever again for
    # that invocation, so there was no way to tell if it even finished.
    after_sleep_cmd = $HOME/.config/hypr/dpms-restore-after-resume.sh
}

listener {
    timeout = 285
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = pidof hyprlock || hyprlock
}

listener {
    timeout = 600
    on-timeout = hyprctl eval 'hl.dispatch(hl.dsp.dpms("off"))'
    on-resume = hyprctl eval 'hl.dispatch(hl.dsp.dpms("on"))'
}
