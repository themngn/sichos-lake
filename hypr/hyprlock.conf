# hyprlock has no built-in defaults — with no config file at all it just
# logs "Could not find config" and exits immediately (looks like SUPER+L
# "does nothing"). This is deployed to ~/.config/hypr alongside the other
# hypr/* files by install.sh's existing loop.
# Colors/font match quickshell/modules/Theme.qml (accent #c102fa, JetBrainsMono
# Nerd Font Mono) so the lock screen looks like the rest of the desktop.

general {
    hide_cursor = false
}

background {
    monitor =
    path = /home/mono/Pictures/default.png
    blur_passes = 2
    blur_size = 6
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 3
    outer_color = rgba(c102faff)
    inner_color = rgba(0, 0, 0, 0.6)
    font_color = rgb(ffffff)
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff99">Password...</span>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(ffffffff)
    font_size = 90
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = rgba(ffffffcc)
    font_size = 22
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = SichOS
    color = rgba(c102faff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, -220
    halign = center
    valign = center
}
