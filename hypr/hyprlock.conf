# hyprlock has no built-in defaults — with no config file at all it just
# logs "Could not find config" and exits immediately (looks like SUPER+L
# "does nothing"). This is deployed to ~/.config/hypr alongside the other
# hypr/* files by install.sh's existing loop.
# Colors/font match quickshell/modules/Theme.qml (accent #698b85, JetBrainsMono
# Nerd Font Mono) so the lock screen looks like the rest of the desktop.

# Colors: Theme.qml's palette, overridden by the wallpaper's (written by
# quickshell/scripts/wallpaper.py at every login and wallpaper change).
# Variables carry their alpha, since hyprlang would read "$accentff" as one
# name (and none is a prefix of another, for the same reason). A missing
# colors file only logs a parse error; these stay.
$accent = rgba(698b85ff)
$text = rgba(f0f9e3ff)
$softText = rgba(f0f9e3cc)
$field = rgba(0e1415bf)
$dim = rgba(b4bbaaaa)
source = $HOME/.local/state/sichos/hyprlock-colors.conf

general {
    hide_cursor = false
}

background {
    monitor =
    # The wallpaper picked in the gallery (SUPER+SHIFT+W): a symlink that
    # quickshell/scripts/wallpaper.py restore recreates at every login.
    path = $HOME/.local/state/sichos/wallpaper
    blur_passes = 2
    blur_size = 6
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 3
    outer_color = $accent
    inner_color = $field
    font_color = $text
    fade_on_empty = false
    placeholder_text = <span foreground="##b4bbaa99">Password...</span>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $text
    font_size = 90
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = $softText
    font_size = 22
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = SichOS
    color = $accent
    font_size = 18
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, -220
    halign = center
    valign = center
}

# Current keyboard layout -- cycled with mainMod+SPACE, which also works
# while locked (see keybindings.lua). Indices match hypr/input.lua's
# kb_layout = "us,ua" order; $LAYOUT auto-updates on the group-change event
# hyprlock picks up from the compositor, no polling needed (unlike the
# cmd[update:...] labels above).
label {
    monitor =
    text = $LAYOUT[EN,UA]
    color = $softText
    font_size = 16
    font_family = JetBrainsMono Nerd Font Mono
    position = -30, -30
    halign = right
    valign = top
}

# Shows the currently playing track, if any — playerctl also needs
# SUPER+Z bound with `locked = true` (keybindings.lua) to actually
# control it (play/pause) while the screen is locked, since hyprlock
# has no clickable widgets of its own to press.
# The playerctl call lives in now-playing.sh, not inline here: hyprlock's
# config parser treats "{{ }}" as its own template-variable syntax (same
# family as $TIME/$LAYOUT), so a literal --format string with double
# braces gets mangled before playerctl ever sees it.
label {
    monitor =
    text = cmd[update:2000] $HOME/.config/hypr/now-playing.sh
    color = $dim
    font_size = 14
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, -180
    halign = center
    valign = center
}
