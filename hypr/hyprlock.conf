# hyprlock has no built-in defaults — with no config file at all it just
# logs "Could not find config" and exits immediately (looks like SUPER+L
# "does nothing"). This is deployed to ~/.config/hypr alongside the other
# hypr/* files by install.sh's existing loop.
# Colors/font match quickshell/modules/Theme.qml (accent #698b85, JetBrainsMono
# Nerd Font Mono) so the lock screen looks like the rest of the desktop.

general {
    hide_cursor = false
}

background {
    monitor =
    path = $HOME/Pictures/wallpaper.jpg
    blur_passes = 2
    blur_size = 6
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 3
    outer_color = rgba(698b85ff)
    inner_color = rgba(14, 20, 21, 0.75)
    font_color = rgb(f0f9e3)
    fade_on_empty = false
    placeholder_text = <span foreground="##b4bbaa99">Password...</span>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(f0f9e3ff)
    font_size = 90
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = rgba(f0f9e3cc)
    font_size = 22
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = SichOS
    color = rgba(698b85ff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, -220
    halign = center
    valign = center
}

# Current keyboard layout -- cycled with mainMod+SPACE, which also works
# while locked (see keybindings.lua). Indices match hypr/input.lua's
# kb_layout = "us,ua" order; $LAYOUT auto-updates on the group-change event
# hyprlock picks up from the compositor, no polling needed (unlike the
# cmd[update:...] labels above).
label {
    monitor =
    text = $LAYOUT[EN,UA]
    color = rgba(f0f9e3cc)
    font_size = 16
    font_family = JetBrainsMono Nerd Font Mono
    position = -30, -30
    halign = right
    valign = top
}

# Shows the currently playing track, if any — playerctl also needs
# SUPER+Z bound with `locked = true` (keybindings.lua) to actually
# control it (play/pause) while the screen is locked, since hyprlock
# has no clickable widgets of its own to press.
# The playerctl call lives in now-playing.sh, not inline here: hyprlock's
# config parser treats "{{ }}" as its own template-variable syntax (same
# family as $TIME/$LAYOUT), so a literal --format string with double
# braces gets mangled before playerctl ever sees it.
label {
    monitor =
    text = cmd[update:2000] $HOME/.config/hypr/now-playing.sh
    color = rgba(b4bbaaaa)
    font_size = 14
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, -180
    halign = center
    valign = center
}
